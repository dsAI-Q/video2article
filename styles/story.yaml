# 故事叙事风
name: story
description: 适合人物故事、经历分享、品牌故事类视频

title_rule: 用「悬念/情绪 + 具体细节」句式，如「那个凌晨 3 点的电话，改变了我整个项目」；不超过 25 字。

tone: 有画面感、共情、克制；多用时间线与细节，少用总结性形容词。

structure:
  - 导语（一个高光细节或悬念开场，不剧透）
  - 故事主体（按时间/因果分 3-5 小节，每节一个小标题）
  - 转折与领悟（1 段）
  - 结尾（呼应开头，留下回味或一句金句）

format_notes: 多用短句与对话；小标题（##）可用「时间/场景」命名；避免说教。
