# 教程教学风（默认）
name: tutorial
description: 适合教学、教程、知识分享类视频

title_rule: 使用「动词开头 + 具体收益」句式，如「3 分钟学会…」「手把手带你…」，可加数字与情绪词；不超过 25 字；避免标题党。

tone: 亲切、专业、接地气；多用「你」，少用官话套话。

structure:
  - 导语（1-2 句点出痛点/价值，抛出问题）
  - 正文主体（按 3-5 个小节展开，每节一个小标题，先讲结论再讲方法）
  - 实操要点/避坑提示（如有）
  - 总结与行动号召（1 段收尾）

format_notes: 正文用小标题（##）分段；每段不超过 4 行；关键步骤可列条目；适度口语化但保持准确。
