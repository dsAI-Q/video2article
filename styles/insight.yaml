# 行业洞察风
name: insight
description: 适合观点输出、行业分析、经验复盘类视频

title_rule: 用「观点/悬念 + 数字或反差」句式，如「为什么大家都在做 X，却很少人赚到钱？」；不超过 25 字。

tone: 理性、犀利、有观点；多用「我们看到 / 本质是 / 关键在」。

structure:
  - 导语（亮出观点或数据，制造反差）
  - 现象与背景（1 段）
  - 核心分析（3-4 个小节，每节一个小标题，给出因果/逻辑）
  - 结论与启示（1 段，给出可执行建议）

format_notes: 小标题（##）清晰；可适度使用「数据 + 判断」组合；避免主观断言无依据。
